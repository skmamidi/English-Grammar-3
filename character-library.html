<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Character Library</title>
  <script src="assets/theme.js"></script>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="container">
      <a href="index.html" class="logo">English Language Mastery</a>
      <nav class="header-actions" aria-label="Quick links">
        <a href="index.html" class="back-link">All practice</a>
        <a href="character-library.html" class="header-icon-link active" aria-label="Character library" title="Character Library">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <circle cx="9" cy="9" r="4"></circle>
            <path d="M4 20c.7-3 2.4-5 5-5s4.3 2 5 5"></path>
            <path d="M17.5 10.5c1.4 0 2.5 1.1 2.5 2.5s-1.1 2.5-2.5 2.5S15 14.4 15 13s1.1-2.5 2.5-2.5Z"></path>
            <path d="M16 19c.4-1.3 1.1-2 2-2s1.6.7 2 2"></path>
            <path d="M16.5 7.5 18 5l1.5 2.5"></path>
          </svg>
        </a>
        <a href="reports.html" class="header-icon-link" aria-label="Open teacher and parent reports" title="Reports">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M4 19V5"></path>
            <path d="M4 19h16"></path>
            <path d="M8 16v-5"></path>
            <path d="M12 16V8"></path>
            <path d="M16 16v-7"></path>
            <path d="M20 16v-3"></path>
          </svg>
        </a>
      </nav>
    </div>
  </header>

  <main class="container character-library-shell">
    <section class="character-library-hero">
      <div>
        <div class="quest-kicker">Character Library</div>
        <h1 class="page-title">Meet the grammar companions</h1>
        <p class="page-subtitle">Choose the cast, preview their expression range, and personalize character and pet names for every quiz scene.</p>
      </div>
      <button class="btn btn-secondary" type="button" id="reset-character-names">Reset names</button>
    </section>

    <section class="library-set-picker" aria-label="Active character set">
      <label for="library-character-set">Cast used in quizzes</label>
      <select id="library-character-set"></select>
    </section>

    <div id="character-library-root"></div>
  </main>

  <script src="assets/character-catalog.js"></script>
  <script src="assets/character-library.js"></script>
  <script src="assets/firebase-config.js"></script>
  <script src="assets/progress-store.js"></script>
  <script type="module" src="assets/auth-service.js"></script>
</body>
</html>

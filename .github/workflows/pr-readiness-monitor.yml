name: PR Readiness Monitor

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Explain retired monitor
        run: |
          echo "PR readiness monitor retired."
          echo "The old 30-minute queue check depended on docs/prs/status.json, which is local planning data and is not tracked in CI."
          echo "Use the QA and Full Regression workflows for active readiness signals."
